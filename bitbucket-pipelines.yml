clone:
  depth: full

pipelines:
  custom:
    release-current-version:
      - step:
          name: Publish the current plugin version to GitHub
          image: atlassian/default-image:4
          script:
            - export RELEASE_PLUGIN=1
            - bash bin/release-plugin.sh --current
  branches:
    master:
      - step:
          name: Push to GitHub Repository
          script:
            - git remote add github https://${GITHUB_USERNAME}:${GITHUB_TOKEN}@github.com/mailblaze/mailblaze-woocommerce-plugin.git
            - git push github master
          services:
            - docker
      - step:
          name: Release plugin zip when the version changes
          image: atlassian/default-image:4
          script:
            - export RELEASE_PLUGIN=1
            - bash bin/release-plugin.sh
